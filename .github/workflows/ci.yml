name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and declared upper bound. The floor is `requires-python` in
        # pyproject.toml and the README Requirements section (3.11); 3.14 is the
        # highest version the suite has been run green on. Both ends of the
        # declared range are covered.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The suite builds its own SQLite fixtures in a temp HOME and never opens a
      # real tracker index — but it imports `aut_picker` to test the date-range
      # helpers, and that module is a Textual modal. So the board's runtime
      # dependency is installed even though no test opens a screen.
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        run: python3 -m unittest discover -s scripts/tests
