[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-usage-trackers"
version = "0.5.0"
description = "One read-only six-tab overview over the local usage trackers (cbut, ocut, qcut): cross-tool totals, one definition of the usage total, and a hand-off to each tracker's own TUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The headless views (aut json / aut sync) are pure stdlib. The board's only
# runtime dependency (textual) is listed in requirements.txt, the authoritative
# flat list install.sh installs from; it is not duplicated here.
dependencies = []
